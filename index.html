<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0b0f14;color:#e7ecf3;height:100dvh;display:flex;flex-direction:column}header{padding:14px 16px;font-weight:700;background:#11161d;border-bottom:1px solid #1e2530}#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.msg{max-width:86%;padding:11px 14px;border-radius:18px;white-space:pre-wrap;line-height:1.55;word-break:break-word}.user{align-self:flex-end;background:#2f6fed;color:#fff;border-bottom-right-radius:6px}.ai{align-self:flex-start;background:#1a212b;border:1px solid #232b36;border-bottom-left-radius:6px}form{display:flex;gap:8px;padding:10px;background:#11161d;border-top:1px solid #1e2530}input{flex:1;padding:13px;border-radius:14px;border:1px solid #2a323d;background:#0b0f14;color:#e7ecf3;font-size:16px}button{padding:13px 18px;border:0;border-radius:14px;background:#2f6fed;color:#fff;font-weight:600}
</style>
</head>
<body>
<header>My AI Chat</header>
<div id="chat"></div>
<form id="f"><input id="text" placeholder="输入消息…" autocomplete="off"><button>发送</button></form>
<script>
const chat=document.getElementById('chat');let messages=[{role:'system',content:'你是一个友好、清晰、简洁的中文助手。'}];
function add(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function settings(){let u=localStorage.getItem('ds_url'),k=localStorage.getItem('ds_key'),m=localStorage.getItem('ds_model');if(!u||!k||!m){u=prompt('DeepSeek API 地址','https://api.deepseek.com/chat/completions');k=prompt('DeepSeek API Key');m=prompt('模型名称','deepseek-chat');if(!u||!k||!m)return false;localStorage.setItem('ds_url',u);localStorage.setItem('ds_key',k);localStorage.setItem('ds_model',m)}return true}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();if(!settings())return;const i=document.getElementById('text'),t=i.value.trim();if(!t)return;add('user',t);messages.push({role:'user',content:t});i.value='';const box=add('ai','正在思考…');try{const r=await fetch(localStorage.getItem('ds_url'),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('ds_key')},body:JSON.stringify({model:localStorage.getItem('ds_model'),messages,stream:true})});if(!r.ok)throw new Error('HTTP '+r.status);const reader=r.body.getReader(),dec=new TextDecoder();let reply='',buf='';while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();for(const line of lines){if(!line.startsWith('data:'))continue;const s=line.slice(5).trim();if(s==='[DONE]')continue;try{const j=JSON.parse(s);const piece=j.choices?.[0]?.delta?.content||'';if(piece){reply+=piece;box.textContent=reply;chat.scrollTop=chat.scrollHeight}}catch(err){}}}messages.push({role:'assistant',content:reply})}catch(err){box.textContent='出错了：'+err.message}};
</script>
</body>
</html>
