<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI Chat</title>
<style>
:root{--bg:#0b0f14;--panel:#11161d;--border:#1e2530;--text:#e7ecf3;--muted:#7d8797;--ai:#1a212b;--ai-border:#232b36;--accent:#2f6fed}*{box-sizing:border-box}body.light{--bg:#f4f6fa;--panel:#ffffff;--border:#e3e8ef;--text:#18202b;--muted:#667085;--ai:#ffffff;--ai-border:#dfe5ee;--accent:#2f6fed}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--border)}#menu{font-size:22px;background:none;border:0;color:var(--text);padding:6px 10px;border-radius:10px}h1{font-size:17px;margin:0}#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:10px;align-items:flex-end}.row.user{flex-direction:row-reverse}.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}.avatar.ai{background:var(--accent);color:#fff}.avatar.user{background:#6b7280;color:#fff}.msg{max-width:76%;padding:11px 14px;white-space:pre-wrap;line-height:1.55;word-break:break-word}.msg.round{border-radius:18px}.msg.square{border-radius:8px}.user .msg{background:var(--accent);color:#fff;border-bottom-right-radius:6px}.ai .msg{background:var(--ai);border:1px solid var(--ai-border);border-bottom-left-radius:6px}form{display:flex;gap:8px;padding:10px;background:var(--panel);border-top:1px solid var(--border)}input{flex:1;padding:13px;border-radius:14px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px}button{padding:13px 18px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:600}#overlay{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:.2s;z-index:9}#overlay.open{opacity:1;pointer-events:auto}#sidebar{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:330px;background:var(--panel);border-right:1px solid var(--border);padding:18px 14px;transform:translateX(-105%);transition:.25s;z-index:10;display:flex;flex-direction:column;gap:10px;overflow-y:auto}#sidebar.open{transform:none}.side-title{font-weight:800;font-size:18px;margin:4px 4px 14px}.side-btn{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:15px}.side-note{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.5}.panel{display:none;margin-top:6px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg)}.panel.open{display:block}.panel h3{margin:0 0 10px;font-size:15px}.choice{display:flex;gap:8px;margin-bottom:10px}.choice button{flex:1;padding:10px;border-radius:10px;background:var(--panel);border:1px solid var(--border);color:var(--text);font-weight:600}.choice button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<header><button id="menu" type="button">☰</button><h1>My AI Chat</h1></header>
<div id="chat"></div>
<form id="f"><input id="text" placeholder="输入消息…" autocomplete="off"><button>发送</button></form>
<div id="overlay"></div>
<aside id="sidebar">
<div class="side-title">我的 AI</div>
<button class="side-btn" id="newChat">新对话</button>
<button class="side-btn" id="settings">设置</button>
<button class="side-btn" id="themeBtn">主题与气泡</button>
<button class="side-btn" id="clearChat">清空当前对话</button>
<div class="panel" id="themePanel">
<h3>主题与气泡</h3>
<div class="choice"><button id="darkMode" class="active">深色模式</button><button id="lightMode">浅色模式</button></div>
<div class="choice"><button id="roundBubble" class="active">圆角气泡</button><button id="squareBubble">方角气泡</button></div>
<div class="choice"><button id="showAvatar" class="active">显示头像</button><button id="hideAvatar">隐藏头像</button></div>
</div>
<div class="side-note">你的 DeepSeek API Key 只保存在这台手机的浏览器里，不会写入 GitHub。</div>
</aside>
<script>
const chat=document.getElementById('chat'),sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');let messages=[{role:'system',content:'你是一个友好、清晰、简洁的中文助手。'}];
function openSidebar(v){sidebar.classList.toggle('open',v);overlay.classList.toggle('open',v)}
document.getElementById('menu').onclick=()=>openSidebar(true);overlay.onclick=()=>openSidebar(false);
function add(role,text){const row=document.createElement('div');row.className='row '+role;const av=document.createElement('div');av.className='avatar '+role;av.textContent=role==='user'?'我':'AI';const d=document.createElement('div');d.className='msg '+(localStorage.getItem('bubble')==='square'?'square':'round');d.textContent=text;row.appendChild(av);row.appendChild(d);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return d}
function applyTheme(){const t=localStorage.getItem('theme')||'dark';document.body.classList.toggle('light',t==='light');document.getElementById('darkMode').classList.toggle('active',t!=='light');document.getElementById('lightMode').classList.toggle('active',t==='light');const b=localStorage.getItem('bubble')||'round';document.getElementById('roundBubble').classList.toggle('active',b!=='square');document.getElementById('squareBubble').classList.toggle('active',b==='square');const a=localStorage.getItem('avatar')!=='hide';document.getElementById('showAvatar').classList.toggle('active',a);document.getElementById('hideAvatar').classList.toggle('active',!a);document.querySelectorAll('.avatar').forEach(x=>x.style.display=a?'flex':'none')}
function settings(){let u=localStorage.getItem('ds_url'),k=localStorage.getItem('ds_key'),m=localStorage.getItem('ds_model');u=prompt('DeepSeek API 地址',u||'https://api.deepseek.com/chat/completions');k=prompt('DeepSeek API Key',k||'');m=prompt('模型名称',m||'deepseek-chat');if(u&&k&&m){localStorage.setItem('ds_url',u);localStorage.setItem('ds_key',k);localStorage.setItem('ds_model',m);return true}return false}
document.getElementById('themeBtn').onclick=()=>document.getElementById('themePanel').classList.toggle('open');
document.getElementById('darkMode').onclick=()=>{localStorage.setItem('theme','dark');applyTheme()};
document.getElementById('lightMode').onclick=()=>{localStorage.setItem('theme','light');applyTheme()};
document.getElementById('roundBubble').onclick=()=>{localStorage.setItem('bubble','round');applyTheme()};
document.getElementById('squareBubble').onclick=()=>{localStorage.setItem('bubble','square');applyTheme()};
document.getElementById('showAvatar').onclick=()=>{localStorage.setItem('avatar','show');applyTheme()};
document.getElementById('hideAvatar').onclick=()=>{localStorage.setItem('avatar','hide');applyTheme()};
document.getElementById('settings').onclick=()=>{openSidebar(false);settings()};
document.getElementById('newChat').onclick=()=>{messages=[{role:'system',content:'你是一个友好、清晰、简洁的中文助手。'}];chat.innerHTML='';add('ai','新对话已创建。有什么想聊的？');openSidebar(false)};
document.getElementById('clearChat').onclick=()=>{messages=[{role:'system',content:'你是一个友好、清晰、简洁的中文助手。'}];chat.innerHTML='';add('ai','当前对话已清空。');openSidebar(false)};
document.getElementById('f').onsubmit=async e=>{e.preventDefault();if(!localStorage.getItem('ds_key')&&!settings())return;const i=document.getElementById('text'),t=i.value.trim();if(!t)return;add('user',t);messages.push({role:'user',content:t});i.value='';const box=add('ai','正在思考…');try{const r=await fetch(localStorage.getItem('ds_url'),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('ds_key')},body:JSON.stringify({model:localStorage.getItem('ds_model'),messages,stream:true})});if(!r.ok)throw new Error('HTTP '+r.status);const reader=r.body.getReader(),dec=new TextDecoder();let reply='',buf='';while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();for(const line of lines){if(!line.startsWith('data:'))continue;const s=line.slice(5).trim();if(s==='[DONE]')continue;try{const j=JSON.parse(s);const piece=j.choices?.[0]?.delta?.content||'';if(piece){reply+=piece;box.textContent=reply;chat.scrollTop=chat.scrollHeight}}catch(err){}}}messages.push({role:'assistant',content:reply})}catch(err){box.textContent='出错了：'+err.message}};
applyTheme();
</script>
</body>
</html>
