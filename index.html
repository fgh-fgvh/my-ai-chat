<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI</title>
<style>
:root{--bg1:#070b12;--bg2:#101a2b;--glass:rgba(255,255,255,.07);--glass-strong:rgba(255,255,255,.12);--border:rgba(255,255,255,.14);--text:#eaf0f8;--muted:#9aa7b8;--accent:#4f8cff;--user:#2f6fed}*{box-sizing:border-box}body.light{--bg1:#eef3fb;--bg2:#dce7f7;--glass:rgba(255,255,255,.62);--glass-strong:rgba(255,255,255,.78);--border:rgba(20,40,70,.12);--text:#16202c;--muted:#5c6b7d;--accent:#2f6fed;--user:#2f6fed}body{margin:0;font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--text);height:100dvh;overflow:hidden;background:radial-gradient(1200px 700px at 10% 0%,#274b8f55,transparent),radial-gradient(900px 600px at 90% 100%,#7b4bd055,transparent),linear-gradient(160deg,var(--bg1),var(--bg2))}#app{display:flex;height:100dvh}#sidebar{width:290px;flex:none;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-right:1px solid var(--border);padding:16px 12px;overflow-y:auto;transition:transform .28s ease;z-index:20}#main{flex:1;display:flex;flex-direction:column;min-width:0}.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}.brand-avatar{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#8a5cff);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}.brand-name{font-weight:800;font-size:18px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{width:100%;text-align:left;padding:12px 13px;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--text);font-size:15px}.nav button.active,.nav button:hover{background:var(--glass-strong);border-color:var(--border)}#menuBtn{display:none}header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}header h1{margin:0;font-size:17px;flex:1}#menuBtn{background:var(--glass-strong);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:8px 12px}#view{flex:1;overflow-y:auto;padding:18px 14px 120px}.page{display:none}.page.active{display:block}.card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px}.card h2{margin:0 0 10px;font-size:17px}.row{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}.row.user{flex-direction:row-reverse}.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none;color:#fff}.avatar.ai{background:linear-gradient(135deg,var(--accent),#8a5cff)}.avatar.user{background:#596577}.bubble{max-width:78%;padding:12px 15px;line-height:1.6;white-space:pre-wrap;word-break:break-word;background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);box-shadow:0 8px 28px #0003}.bubble.round{border-radius:20px}.bubble.square{border-radius:8px}.user .bubble{background:linear-gradient(135deg,var(--user),#5b8cff);border-color:#ffffff22;color:#fff}.ai .bubble{border-bottom-left-radius:6px}.user .bubble{border-bottom-right-radius:6px}#composer{position:fixed;left:0;right:0;bottom:0;padding:12px 14px 18px;background:linear-gradient(to top,var(--bg1) 30%,transparent);z-index:5}.composer-inner{display:flex;gap:8px;background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:22px;padding:8px}input,select{flex:1;min-width:0;padding:12px 14px;border-radius:16px;border:1px solid var(--border);background:#ffffff10;color:var(--text);font-size:16px}body.light input,body.light select{background:#ffffffcc}button{border:0;border-radius:16px;background:var(--accent);color:#fff;font-weight:700;padding:12px 18px}button.ghost{background:var(--glass-strong);color:var(--text);border:1px solid var(--border)}#overlay{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:.2s;z-index:15}#overlay.open{opacity:1;pointer-events:auto}.list-item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--glass-strong);margin-bottom:8px}.list-item .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.small{font-size:12px;color:var(--muted)}.switch{width:46px;height:26px;border-radius:999px;background:#4a5568;position:relative;flex:none}.switch.on{background:var(--accent)}.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.switch.on::after{left:23px}@media(max-width:820px){#sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-105%)}#sidebar.open{transform:none}#menuBtn{display:block}}
</style>
</head>
<body>
<div id="app">
<aside id="sidebar">
<div class="brand"><div class="brand-avatar">AI</div><div class="brand-name">AI</div></div>
<nav class="nav">
<button data-view="chat" class="active">新对话</button>
<button data-view="history">历史记录</button>
<button data-view="memory">长期记忆</button>
<button data-view="plugins">插件</button>
<button data-view="model">模型</button>
<button data-view="settings">设置</button>
</nav>
<div class="small" style="margin-top:auto;padding:12px 8px">前端连接你自己的 AI 服务。API Key 仅保存在本机浏览器。</div>
</aside>
<main id="main">
<header><button id="menuBtn">菜单</button><h1 id="pageTitle">AI</h1></header>
<div id="view">
<section class="page active" id="page-chat"><div id="chat"></div></section>
<section class="page" id="page-history"><div class="card"><h2>历史记录</h2><div id="historyList"></div></div></section>
<section class="page" id="page-memory"><div class="card"><h2>长期记忆</h2><button class="ghost" id="addMemory">添加记忆</button><div id="memoryList" style="margin-top:12px"></div></div></section>
<section class="page" id="page-plugins"><div class="card"><h2>插件中心</h2><div id="pluginList"></div><button class="ghost" id="addPlugin" style="margin-top:10px">添加自定义插件</button></div></section>
<section class="page" id="page-model"><div class="card"><h2>模型</h2><button class="ghost" id="modelSettings">设置 API 与模型</button><div class="small" style="margin-top:10px">当前模型：<span id="currentModel"></span></div></div></section>
<section class="page" id="page-settings"><div class="card"><h2>主题与气泡</h2><div class="choice" style="display:flex;gap:8px;margin-bottom:10px"><button class="ghost" id="darkMode">深色</button><button class="ghost" id="lightMode">浅色</button></div><div class="choice" style="display:flex;gap:8px"><button class="ghost" id="roundBubble">圆角气泡</button><button class="ghost" id="squareBubble">方角气泡</button></div></div><div class="card"><h2>头像</h2><div class="choice" style="display:flex;gap:8px"><button class="ghost" id="showAvatar">显示头像</button><button class="ghost" id="hideAvatar">隐藏头像</button></div></div></section>
</div>
<div id="composer"><div class="composer-inner"><input id="text" placeholder="输入消息…" autocomplete="off"><button id="send">发送</button></div></div>
</main>
</div>
<div id="overlay"></div>
<script>
const $=id=>document.getElementById(id);const chat=$('chat');let messages=[],currentId=null;
const store={get:(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d)),set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let conversations=store.get('conversations',[]),memories=store.get('memories',[]),plugins=store.get('plugins',[{name:'网页搜索',connected:false},{name:'文件助手',connected:false},{name:'代码运行',connected:false},{name:'日程提醒',connected:false}]);
function save(){store.set('conversations',conversations);store.set('memories',memories);store.set('plugins',plugins)}
function show(view){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$('page-'+view).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('pageTitle').textContent={chat:'AI',history:'历史记录',memory:'长期记忆',plugins:'插件',model:'模型',settings:'设置'}[view];if(view==='history')renderHistory();if(view==='memory')renderMemory();if(view==='plugins')renderPlugins();if(view==='model')$('currentModel').textContent=localStorage.getItem('model')||'未设置';closeSidebar()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));
function openSidebar(v){$('sidebar').classList.toggle('open',v);$('overlay').classList.toggle('open',v)}
$('menuBtn').onclick=()=>openSidebar(true);$('overlay').onclick=()=>openSidebar(false);
function add(role,text){const row=document.createElement('div');row.className='row '+role;const av=document.createElement('div');av.className='avatar '+role;av.textContent=role==='user'?'我':'AI';const b=document.createElement('div');b.className='bubble '+(localStorage.getItem('bubble')==='square'?'square':'round');b.textContent=text;row.append(av,b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return b}
function applyTheme(){const t=localStorage.getItem('theme')||'dark';document.body.classList.toggle('light',t==='light');const b=localStorage.getItem('bubble')||'round';document.querySelectorAll('.bubble').forEach(x=>{x.classList.toggle('round',b!=='square');x.classList.toggle('square',b==='square')});const a=localStorage.getItem('avatar')!=='hide';document.querySelectorAll('.avatar').forEach(x=>x.style.display=a?'flex':'none')}
$('darkMode').onclick=()=>{localStorage.setItem('theme','dark');applyTheme()};$('lightMode').onclick=()=>{localStorage.setItem('theme','light');applyTheme()};$('roundBubble').onclick=()=>{localStorage.setItem('bubble','round');applyTheme()};$('squareBubble').onclick=()=>{localStorage.setItem('bubble','square');applyTheme()};$('showAvatar').onclick=()=>{localStorage.setItem('avatar','show');applyTheme()};$('hideAvatar').onclick=()=>{localStorage.setItem('avatar','hide');applyTheme()};
function newChat(){currentId=Date.now();messages=[{role:'system',content:'你是一个聪明、清晰、可靠的中文助手。'}];conversations.unshift({id:currentId,title:'新对话',messages:[]});save();chat.innerHTML='';add('ai','你好，我是 AI。有什么可以帮你？');show('chat')}
function renderHistory(){$('historyList').innerHTML='';if(!conversations.length){$('historyList').innerHTML='<div class="small">暂无历史记录。</div>';return}conversations.forEach(c=>{const d=document.createElement('div');d.className='list-item';d.innerHTML='<div class="title">'+(c.title||'新对话')+'</div>';const open=document.createElement('button');open.className='ghost';open.textContent='打开';open.onclick=()=>{currentId=c.id;messages=structuredClone(c.messages);chat.innerHTML='';c.messages.slice(1).forEach(m=>add(m.role,m.content));show('chat')};const del=document.createElement('button');del.className='ghost';del.textContent='删除';del.onclick=()=>{conversations=conversations.filter(x=>x.id!==c.id);save();renderHistory()};d.append(open,del);$('historyList').appendChild(d)})}
function renderMemory(){$('memoryList').innerHTML='';if(!memories.length){$('memoryList').innerHTML='<div class="small">暂无长期记忆。</div>';return}memories.forEach((m,i)=>{const d=document.createElement('div');d.className='list-item';d.innerHTML='<div class="title">'+m+'</div>';const del=document.createElement('button');del.className='ghost';del.textContent='删除';del.onclick=()=>{memories.splice(i,1);save();renderMemory()};d.append(del);$('memoryList').appendChild(d)})}
$('addMemory').onclick=()=>{const v=prompt('要长期记住什么？');if(v){memories.unshift(v);save();renderMemory()}};
function renderPlugins(){$('pluginList').innerHTML='';plugins.forEach((p,i)=>{const d=document.createElement('div');d.className='list-item';d.innerHTML='<div class="title">'+p.name+'<div class="small">'+(p.connected?'已连接':'未连接')+'</div></div>';const s=document.createElement('div');s.className='switch'+(p.connected?' on':'');s.onclick=()=>{p.connected=!p.connected;save();renderPlugins()};d.appendChild(s);$('pluginList').appendChild(d)})}
$('addPlugin').onclick=()=>{const n=prompt('插件名称');if(n){plugins.push({name:n,connected:false});save();renderPlugins()}};
$('modelSettings').onclick=()=>{const u=prompt('API 地址',localStorage.getItem('apiUrl')||'https://api.deepseek.com/chat/completions');const k=prompt('API Key',localStorage.getItem('apiKey')||'');const m=prompt('模型名称',localStorage.getItem('model')||'deepseek-chat');if(u&&k&&m){localStorage.setItem('apiUrl',u);localStorage.setItem('apiKey',k);localStorage.setItem('model',m);$('currentModel').textContent=m}};
async function send(){const t=$('text').value.trim();if(!t)return;if(!localStorage.getItem('apiKey')&&!modelSettings())return;if(!currentId)newChat();add('user',t);messages.push({role:'user',content:t});conversations[0].messages=structuredClone(messages);conversations[0].title=conversations[0].title==='新对话'?t.slice(0,18):conversations[0].title;save();$('text').value='';const box=add('ai','正在思考…');try{const r=await fetch(localStorage.getItem('apiUrl'),{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('apiKey')},body:JSON.stringify({model:localStorage.getItem('model'),messages,stream:true})});if(!r.ok)throw new Error('HTTP '+r.status);const reader=r.body.getReader(),dec=new TextDecoder();let reply='',buf='';while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();for(const line of lines){if(!line.startsWith('data:'))continue;const s=line.slice(5).trim();if(s==='[DONE]')continue;try{const j=JSON.parse(s);const p=j.choices?.[0]?.delta?.content||'';if(p){reply+=p;box.textContent=reply;chat.scrollTop=chat.scrollHeight}}catch(e){}}}messages.push({role:'assistant',content:reply});conversations[0].messages=structuredClone(messages);save()}catch(e){box.textContent='出错了：'+e.message}}
function modelSettings(){const u=prompt('API 地址','https://api.deepseek.com/chat/completions');const k=prompt('API Key');const m=prompt('模型名称','deepseek-chat');if(u&&k&&m){localStorage.setItem('apiUrl',u);localStorage.setItem('apiKey',k);localStorage.setItem('model',m);return true}return false}
$('send').onclick=send;$('text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('newChat').onclick=newChat;applyTheme();if(!conversations.length)newChat();else{currentId=conversations[0].id;messages=structuredClone(conversations[0].messages);messages.slice(1).forEach(m=>add(m.role,m.content))}
</script>
</body>
</html>
